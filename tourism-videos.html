<style>
:root{
  --bg:#070f18;
  --card:#0d2432;
  --cardAlt:#0a1c28;
  --gold:#ffd36a;
  --goldBright:#ffe39a;
  --teal:#22e0ad;
  --tealBright:#6df5cf;
  --brand1:#11998e;
  --brand2:#38ef7d;
  --brand3:#667eea;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  padding-bottom:40px;
}
a{color:inherit;}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:18px 16px 6px;
}
.header h1{
  font-size:22px;
  margin:0;
  font-weight:900;
}
.backBtn{
  width:38px;height:38px;border-radius:50%;
  background:var(--card);
  border:1px solid rgba(255,211,106,.28);
  color:#fff;display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-size:17px;flex-shrink:0;
}

.searchWrap{padding:14px 16px 4px;}
.searchBox{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid rgba(255,211,106,.2);
  border-radius:18px;
  padding:14px 16px;
}
.searchBox input{
  flex:1;background:transparent;border:0;outline:0;color:#fff;
  font-size:14px;font-family:inherit;
}
.searchBox input::placeholder{color:rgba(255,255,255,.4);}
.searchIcon{color:var(--gold);font-size:16px;}

.filterRow{
  display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;
  scrollbar-width:none;
}
.filterRow::-webkit-scrollbar{display:none;}
.filterChip{
  flex-shrink:0;
  padding:9px 15px;border-radius:20px;font-size:12.5px;font-weight:bold;
  background:var(--card);border:1px solid rgba(255,211,106,.22);color:rgba(255,255,255,.8);
  cursor:pointer;white-space:nowrap;
}
.filterChip.active{
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  border-color:transparent;color:#04241f;
}
.filterChip.leaderChip{
  border:1px dashed rgba(255,211,106,.55);
  color:var(--goldBright);
  background:rgba(255,211,106,.08);
}
.filterChip.leaderChip:active{
  background:rgba(255,211,106,.22);
}
.ctToast{
  position:fixed;left:50%;bottom:26px;
  transform:translateX(-50%) translateY(18px);
  max-width:calc(100% - 32px);width:340px;
  background:linear-gradient(135deg,rgba(20,15,0,.96),rgba(10,8,0,.96));
  border:1px solid rgba(255,211,106,.5);
  box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,211,106,.12) inset;
  color:var(--goldBright);font-size:12.5px;line-height:1.9;
  padding:14px 16px;border-radius:16px;text-align:center;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
}
.ctToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:16px;
}
.vCard{
  border-radius:20px;overflow:hidden;
  background:var(--card);
  border:1px solid rgba(255,211,106,.14);
  text-decoration:none;color:#fff;
  display:block;
  box-shadow:0 12px 28px rgba(0,0,0,.3);
}
.vCoverWrap{
  position:relative;
  width:100%;aspect-ratio:1/1;
  background:linear-gradient(135deg,#0a1c28,#12394d);
  overflow:hidden;
}
.vCoverWrap iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
  pointer-events:none;
}
.vBadge{
  position:absolute;top:10px;left:10px;z-index:2;
  padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:900;
  background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));
  color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35);
}
.vHeart{
  position:absolute;top:8px;right:8px;z-index:3;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
  border:1px solid rgba(255,211,106,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;padding:0;
  transition:.18s;
}
.vHeart.active{
  background:rgba(255,90,120,.28);
  border-color:rgba(255,120,150,.65);
  box-shadow:0 0 0 3px rgba(255,120,150,.18);
}
.vPlay{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
}
.vPlay span{
  width:46px;height:46px;border-radius:50%;
  background:rgba(0,0,0,.42);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}
.vBody{padding:13px 13px 15px;}
.vTitle{
  font-size:13.5px;font-weight:bold;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.6em;
}
.vDesc{
  font-size:11px;color:rgba(255,255,255,.5);margin-top:7px;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.vLoc{
  margin-top:9px;font-size:11.5px;color:var(--goldBright);
  display:flex;align-items:center;gap:4px;
}

.emptyState{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:rgba(255,255,255,.5);
}
.emptyState .ic{font-size:36px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="header">
<h1>گالری فیلم‌های گردشگری</h1>
<a class="backBtn" href="index.html#videos" aria-label="بازگشت">→</a>
</div>

<div class="searchWrap">
<div class="searchBox">
<input id="searchInput" type="search" placeholder="جست‌وجو با کد، نام فیلم، شهر یا استان..." autocomplete="off">
<span class="searchIcon">🔎</span>
</div>
</div>

<div class="filterRow" id="filterRow"></div>

<div class="grid" id="videoGrid"></div>

<script src="tourism-videos-data.js"></script>
<script src="assets/favorites.js"></script>
<script>
const grid = document.getElementById("videoGrid");
const searchInput = document.getElementById("searchInput");
const filterRow = document.getElementById("filterRow");

let activeCat = "";

/* ---------- FILTER CHIPS ---------- */

function buildFilters(){
  const leaderChip = document.createElement("div");
  leaderChip.className = "filterChip leaderChip";
  leaderChip.textContent = "🧭 لیدر تور";
  leaderChip.dataset.leaderTour = "1";
  leaderChip.onclick = function(){ showComingSoon(); };
  filterRow.appendChild(leaderChip);

  const allChip = document.createElement("div");
  allChip.className = "filterChip active";
  allChip.textContent = "همه";
  allChip.onclick = function(){ setActiveCat(""); };
  filterRow.appendChild(allChip);

  Object.keys(TOURISM_CATEGORIES).forEach(function(key){
    const cat = TOURISM_CATEGORIES[key];
    const chip = document.createElement("div");
    chip.className = "filterChip";
    chip.textContent = cat.icon + " " + cat.fa;
    chip.dataset.cat = key;
    chip.onclick = function(){ setActiveCat(key); };
    filterRow.appendChild(chip);
  });
}

function setActiveCat(key){
  activeCat = key;
  Array.from(filterRow.children).forEach(function(chip){
    if(chip.dataset.leaderTour) return;
    chip.classList.toggle("active", (chip.dataset.cat || "") === key);
  });
  render();
}

let ctToastTimer = null;
function showComingSoon(){
  let toastEl = document.getElementById("ctToast");
  if(!toastEl){
    toastEl = document.createElement("div");
    toastEl.id = "ctToast";
    toastEl.className = "ctToast";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = "🚧 این بخش در حال آماده‌سازی است و به‌زودی از پایگاه‌داده فعال می‌شود.";
  toastEl.classList.add("show");
  clearTimeout(ctToastTimer);
  ctToastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}

function favItem(v){
  return { id:v.id, title:v.title.fa, loc:v.loc.fa, hash:v.hash, href:"tourism-video.html?id="+v.id };
}

/* ---------- GRID RENDER ---------- */

function render(){
  const q = (searchInput.value || "").trim().toLowerCase();
  grid.innerHTML = "";

  const filtered = TOURISM_VIDEOS.filter(function(v){
    if(activeCat && v.category !== activeCat) return false;
    if(!q) return true;
    const hay = (
      String(v.id) + " " +
      v.title.fa + " " + v.title.en + " " +
      v.loc.fa + " " + v.loc.en
    ).toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  if(!filtered.length){
    grid.innerHTML =
      '<div class="emptyState"><div class="ic">🎬</div>نتیجه‌ای پیدا نشد</div>';
    return;
  }

  filtered.forEach(function(v){
    const cat = TOURISM_CATEGORIES[v.category];
    const card = document.createElement("a");
    card.className = "vCard";
    card.href = "tourism-video.html?id=" + v.id;

    const fav = CyrusFavorites.isFav("tourism", v.id);

    card.innerHTML =
      '<div class="vCoverWrap">' +
        '<iframe src="https://www.aparat.com/video/video/embed/videohash/' + v.hash + '/vt/frame" loading="lazy"></iframe>' +
        '<div class="vBadge">#' + v.id + '</div>' +
        '<button type="button" class="vHeart' + (fav ? ' active' : '') + '" data-id="' + v.id + '" aria-label="افزودن به علاقه‌مندی‌ها">' + (fav ? '❤️' : '🤍') + '</button>' +
        '<div class="vPlay"><span>▶</span></div>' +
      '</div>' +
      '<div class="vBody">' +
        '<div class="vTitle">' + v.title.fa + '</div>' +
        '<div class="vDesc">بخشی از مجموعه فیلم‌های گردشگری سایروس توریست، در دسته‌ی ' + cat.fa + '...</div>' +
        '<div class="vLoc">📍 ' + v.loc.fa + '</div>' +
      '</div>';

    const heartBtn = card.querySelector(".vHeart");
    heartBtn.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      const nowFav = CyrusFavorites.toggle("tourism", favItem(v));
      heartBtn.classList.toggle("active", nowFav);
      heartBtn.textContent = nowFav ? "❤️" : "🤍";
    });

    grid.appendChild(card);
  });
}

buildFilters();
render();
searchInput.addEventListener("input", render);
</script>

</body>
