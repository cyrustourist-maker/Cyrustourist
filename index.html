<style>
@font-face{
  font-family:"Vazirmatn";
  src:url("assets/Vazirmatn-Variable.woff2") format("woff2");
  font-weight:100 900;
  font-display:swap;
}
:root{
  --bg1:#02132e;
  --bg2:#04275a;
  --line:#2fa8ff;
  --line-soft:rgba(47,168,255,.55);
  --gold:#ffc83d;
  --gold2:#e8a60f;
  --card:rgba(6,34,82,.72);
  --white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#02132e}
html,body{margin:0;min-height:100%}
body{
  font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
  color:var(--white);
  background:
    radial-gradient(120% 60% at 50% 0%,#0a3f86 0%,rgba(10,63,134,0) 60%),
    linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 70%,#010b1c 100%);
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:480px;
  padding:max(14px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ---------- top bar ---------- */
.top{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:ltr;           /* منو چپ، زبان و کاربر راست؛ مثل اپ */
}
.round{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--gold);
  background:rgba(3,22,50,.7);
  display:grid;place-items:center;
  color:var(--gold);
}
.top-right{display:flex;gap:10px;align-items:center}
.lang{
  height:50px;min-width:104px;padding:0 16px;border-radius:16px;
  background:linear-gradient(180deg,#ffd45c,#d99a0a);
  color:#0a1d3c;font-weight:800;font-size:18px;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:0;
}
.user{
  width:52px;height:50px;border-radius:16px;
  border:2px solid var(--gold);
  background:rgba(3,22,50,.7);
  display:grid;place-items:center;color:var(--gold);
}
svg{display:block}

/* ---------- brand ---------- */
.brand{margin-top:6px;text-align:center}
.logo{
  width:118px;height:118px;border-radius:50%;
  padding:5px;
  background:#0a4fa8;
  border:4px solid #2aa4ff;
  box-shadow:0 0 0 7px rgba(42,164,255,.18),0 0 36px rgba(42,164,255,.45);
  margin:0 auto;
  overflow:hidden;
}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.brand h1{
  margin:14px 0 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,10.5vw,50px);
  letter-spacing:1px;font-weight:700;line-height:1.1;
  text-shadow:0 2px 14px rgba(0,0,0,.5);
}
.brand .fa{color:#2aa4ff;font-size:26px;font-weight:700;margin-top:6px}
.brand .en{color:#c3d3ea;font-size:17px;margin-top:6px;direction:ltr;letter-spacing:.3px}
.sep{
  width:78%;height:2px;margin:14px auto 0;
  background:linear-gradient(90deg,transparent,#2aa4ff,transparent);
}

/* ---------- story ---------- */
.story{
  align-self:flex-start;      /* راست در RTL */
  margin:16px 4px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:78px;
}
.story .ring{
  position:relative;width:72px;height:72px;border-radius:50%;
  padding:3px;background:linear-gradient(135deg,#ff9f1a,#ffcc4d 55%,#ff7a00);
}
.story .ring .in{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:3px solid #031632;background:#0a2c5e;display:grid;place-items:center;
}
.story .ring img{width:100%;height:100%;object-fit:cover}
.story .plus{
  position:absolute;left:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#0a1d3c;display:grid;place-items:center;
  border:2px solid #031632;font-weight:900;font-size:20px;line-height:1;
}
.story span{font-size:14px;color:#e5eefc;white-space:nowrap}

/* ---------- search (display only) ---------- */
.search{
  width:100%;margin-top:14px;height:62px;border-radius:999px;
  border:2.5px solid var(--line);
  background:var(--card);
  display:flex;align-items:center;gap:10px;padding:0 8px;
  box-shadow:0 0 22px rgba(42,164,255,.22) inset;
}
.search .btn-c{
  width:46px;height:46px;border-radius:50%;
  border:2px solid var(--line);background:rgba(3,22,50,.8);
  display:grid;place-items:center;color:#fff;flex:none;
}
.search .ph{flex:1;font-size:20px;color:#e9f1ff;padding:0 6px}

/* ---------- pill buttons ---------- */
.row{width:100%;display:flex;gap:12px;margin-top:14px}
.pill{
  flex:1;height:62px;border-radius:999px;
  border:2.5px solid var(--line);
  background:var(--card);
  color:#fff;text-decoration:none;font:inherit;font-size:19px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 0 18px rgba(42,164,255,.18) inset;
  cursor:pointer;
  transition:transform .12s ease,background .12s ease;
}
.pill:active{transform:scale(.97);background:rgba(10,60,130,.85)}
.pill.full{width:100%;flex:none;margin-top:14px}
.pill svg{flex:none}

/* ---------- big circles (display only) ---------- */
.big{
  width:100%;margin-top:26px;display:flex;justify-content:space-around;
}
.big .item{display:flex;flex-direction:column;align-items:center;gap:10px;width:46%}
.circle{
  width:min(150px,36vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1c7fe0 0%,#0a4fb0 55%,#073a86 100%);
  border:3px solid #35b0ff;
  box-shadow:0 0 0 7px rgba(53,176,255,.16),0 0 34px rgba(53,176,255,.45);
  display:grid;place-items:center;color:#fff;
}
.big .label{color:var(--gold);font-weight:800;font-size:22px}

/* ---------- footer ---------- */
.foot{margin-top:30px;text-align:center;font-size:14px;color:#9fb6d8}
.foot a{color:#9fd2ff;text-decoration:none;border-bottom:1px dotted rgba(159,210,255,.6)}

@media (min-width:700px){
  body{align-items:center}
  .app{padding-top:28px;padding-bottom:36px}
}
</style>
</head>
