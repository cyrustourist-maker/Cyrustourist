<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06121d">
<meta name="description" content="سایروس توریست؛ راهنمای سفر و گردشگری ایران، طبیعت‌گردی، جاذبه‌ها، اقامتگاه‌ها و فیلم‌های گردشگری.">
<title>سایروس توریست | ایران را با سایروس توریست ببینید</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<style>
:root{
--bg:#06121d;
--bg2:#0b2230;
--card:rgba(255,255,255,.08);
--line:rgba(255,255,255,.15);
--text:#f5fbff;
--muted:#b9cbd4;
--green:#29e0ad;
--blue:#42b8ff;
--gold:#ffd36a;
--danger:#ff6b6b;
--shadow:0 20px 55px rgba(0,0,0,.3)
}

*{
box-sizing:border-box
}

html{
scroll-behavior:smooth
}

body{
margin:0;
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
line-height:1.9;
background:
radial-gradient(circle at 10% 0%,#124058 0,transparent 30%),
radial-gradient(circle at 90% 10%,#16483e 0,transparent 28%),
linear-gradient(145deg,var(--bg),var(--bg2))
}

body.modal-open{
overflow:hidden
}

a{
color:inherit;
text-decoration:none
}

button,input,select{
font-family:inherit
}

button{
-webkit-tap-highlight-color:transparent
}

.wrap{
width:min(1200px,92%);
margin:auto
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(3,13,22,.96);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--line)
}

.nav{
min-height:86px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-weight:900;
font-size:18px;
white-space:nowrap
}

.brandLogo{
width:68px;
height:68px;
object-fit:contain;
display:block;
border-radius:15px;
background:rgba(255,255,255,.05);
padding:3px
}

.links{
display:flex;
gap:5px;
flex-wrap:wrap;
justify-content:flex-end
}

.links a{
padding:7px 10px;
border:1px solid var(--line);
border-radius:11px;
background:rgba(255,255,255,.05);
font-size:12px
}

.links a:hover{
background:rgba(41,224,173,.15)
}
  .languageBox{
position:relative;
direction:ltr
}

.languageBox select,
.nearbyControls select,
.toolSelect{
appearance:auto;
padding:8px 10px;
border:1px solid var(--line);
border-radius:11px;
background:#102b38;
color:#fff;
outline:none;
cursor:pointer;
font-size:12px
}

.languageBox select option,
.nearbyControls select option,
.toolSelect option{
background:#102b38;
color:#fff
}

.btn{
display:inline-block;
padding:10px 15px;
border:1px solid var(--line);
border-radius:13px;
background:rgba(255,255,255,.07);
color:#fff;
cursor:pointer;
text-align:center
}

.primary{
border:0;
background:linear-gradient(135deg,var(--green),var(--blue));
color:#03202a;
font-weight:900
}

.danger{
background:rgba(255,107,107,.12);
border-color:rgba(255,107,107,.35)
}

.hero{
padding:55px 0 40px
}

.heroGrid{
display:grid;
grid-template-columns:1.1fr .9fr;
gap:30px;
align-items:center
}

.eyebrow{
color:var(--green);
font-weight:900
}

.hero h1{
font-size:clamp(35px,5.5vw,66px);
line-height:1.25;
margin:8px 0 15px
}

.hero p{
color:var(--muted);
font-size:18px;
max-width:700px
}

.search{
display:flex;
gap:8px;
padding:8px;
margin-top:20px;
border:1px solid var(--line);
border-radius:18px;
background:rgba(255,255,255,.07)
}

.search input{
flex:1;
min-width:0;
border:0;
outline:0;
background:transparent;
color:#fff;
padding:10px;
font-size:16px
}

.heroBtns{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:14px
}

.scene{
min-height:350px;
display:grid;
place-items:center;
position:relative
}

.earth{
width:220px;
height:220px;
border-radius:50%;
background:
radial-gradient(circle at 30% 25%,#7af5d3 0 7%,transparent 8%),
radial-gradient(circle at 70% 55%,#42b8ff 0 13%,transparent 14%),
radial-gradient(circle at 42% 72%,#29e0ad 0 12%,transparent 13%),
linear-gradient(145deg,#236a87,#061d2d);
box-shadow:
inset 20px 18px 30px rgba(255,255,255,.13),
inset -35px -35px 50px rgba(0,0,0,.5),
0 30px 60px rgba(0,0,0,.35);
animation:float 5s ease-in-out infinite
}

.pin{
position:absolute;
font-size:35px;
filter:drop-shadow(0 8px 7px #0008)
}

.p1{
top:40px;
right:20%
}

.p2{
bottom:45px;
left:20%
}

.p3{
top:45%;
left:10%
}

@keyframes float{
50%{
transform:translateY(-10px)
}
}

section{
padding:42px 0
}

.title{
display:flex;
justify-content:space-between;
align-items:end;
gap:15px;
margin-bottom:20px
}

.title h2{
margin:0;
font-size:29px
}

.title p{
margin:0;
color:var(--muted)
}

.muted{
color:var(--muted)
}
  .cats{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:12px
}

.cat{
display:block;
padding:18px 8px;
text-align:center;
border:1px solid var(--line);
border-radius:20px;
background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
transition:.25s
}

.cat:hover{
transform:translateY(-5px);
background:rgba(41,224,173,.12)
}

.cat b{
display:block;
font-size:32px
}

.mapBox{
overflow:hidden;
border:1px solid var(--line);
border-radius:25px;
background:#06131b;
box-shadow:var(--shadow);
overscroll-behavior:contain
}

.mapHeader{
padding:15px;
background:linear-gradient(145deg,rgba(41,224,173,.1),rgba(66,184,255,.08));
border-bottom:1px solid var(--line)
}

.mapSearch{
display:flex;
gap:8px
}

.mapSearch input{
flex:1;
min-width:0;
padding:11px 13px;
border:1px solid var(--line);
border-radius:12px;
background:rgba(0,0,0,.22);
color:#fff;
outline:none
}

.mapSearch input::placeholder{
color:#a9bec8
}

.mapSearchResult{
margin-top:8px;
color:#8deed5;
font-size:13px
}


/* اصلاح لمس نقشه */
#touristMap{
width:100%;
height:470px;
direction:ltr;
background:#dbe8ec;
touch-action:pan-y;
overscroll-behavior:none;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none
}

.leaflet-container{
font-family:Tahoma,Arial,sans-serif;
touch-action:pan-y!important;
overscroll-behavior:none!important
}

.leaflet-control-zoom{
direction:ltr
}

.leaflet-control-attribution{
font-size:9px
}

.leaflet-control,
.leaflet-control *{
touch-action:manipulation
}

.mapButtons{
display:flex;
gap:10px;
flex-wrap:wrap;
padding:15px
}

.mapInfo{
padding:0 15px 15px;
color:var(--muted);
font-size:13px
}


/* TOURIST TOOLBOX */

.toolbox{
margin-top:22px;
border:1px1px solid rgba(66,184,255,.25);
border-radius:25px;
padding:18px;
background:
linear-gradient(145deg,rgba(66,184,255,.09),rgba(41,224,173,.06)),
rgba(255,255,255,.03);
box-shadow:var(--shadow)
}

.toolboxHead{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap
}

.toolboxTitle{
font-size:21px;
font-weight:900
}

.toolboxSub{
font-size:12px;
color:var(--muted)
}

.toolGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px
}

.tool{
min-height:92px;
padding:12px;
border:1px solid var(--line);
border-radius:18px;
background:rgba(0,0,0,.16);
color:#fff;
cursor:pointer;
text-align:center;
transition:.2s
}

.tool:hover{
transform:translateY(-3px);
background:rgba(41,224,173,.1)
}

.toolIcon{
display:block;
font-size:30px;
line-height:1.2
}

.toolLabel{
display:block;
margin-top:5px;
font-weight:900;
font-size:13px
}
  .toolStatus{
margin-top:12px;
padding:11px;
border-radius:13px;
background:rgba(0,0,0,.18);
color:#9feedd;
font-size:12px;
min-height:43px
}

.compassBox{
display:none;
margin-top:12px;
text-align:center;
padding:18px;
border:1px solid var(--line);
border-radius:18px;
background:rgba(0,0,0,.18)
}

.compassBox.show{
display:block
}

.compassDial{
width:150px;
height:150px;
margin:10px auto;
border-radius:50%;
border:5px solid rgba(255,255,255,.2);
display:grid;
place-items:center;
position:relative;
background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%)
}

.compassNeedle{
font-size:70px;
transform:rotate(0deg);
transition:.15s
}

.degree{
font-weight:900;
color:var(--green)
}

.nearbyBox{
margin-top:22px;
padding:22px;
border:1px solid rgba(41,224,173,.28);
border-radius:25px;
background:
linear-gradient(145deg,rgba(41,224,173,.1),rgba(66,184,255,.06)),
rgba(255,255,255,.04);
box-shadow:var(--shadow)
}

.nearbyTop{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap
}

.nearbyControls{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center
}

.locationStatus{
margin-top:12px;
color:var(--muted)
}

.nearbyResults{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:18px
}

.placeCard{
padding:17px;
border:1px solid var(--line);
border-radius:18px;
background:rgba(0,0,0,.18)
}

.placeCard h3{
margin:0 0 5px;
font-size:17px
}

.placeMeta{
color:var(--muted);
font-size:13px
}

.placeActions{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:10px
}

.smallBtn{
display:inline-block;
padding:6px 10px;
border:1px solid var(--line);
border-radius:10px;
background:rgba(255,255,255,.06);
color:#fff;
font-size:12px
}

.empty{
padding:20px;
text-align:center;
border:1px dashed var(--line);
border-radius:17px;
color:var(--muted);
grid-column:1/-1
}

.videos{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px
}

.videoCard{
overflow:hidden
}

.videoHead{
display:flex;
align-items:center;
gap:10px
}

.num{
width:40px;
height:40px;
flex:none;
display:grid;
place-items:center;
border-radius:50%;
background:linear-gradient(135deg,var(--green),var(--blue));
color:#03202a;
font-weight:900
}

.embed{
margin-top:14px;
overflow:hidden;
border-radius:17px;
background:#000;
position:relative;
width:100%;
aspect-ratio:16/9
}

.embed iframe{
display:block;
width:100%;
height:100%;
border:0;
background:#000
}

.text{
padding-top:12px
}

.tag{
color:#8deed5;
font-size:12px
}

.actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:13px
}
  <footer>
<div class="wrap">
<div class="muted">
© سایروس توریست - راهنمای گردشگری ایران
</div>
</div>
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
const map = L.map('touristMap',{
dragging:false,
scrollWheelZoom:false,
doubleClickZoom:false,
boxZoom:false,
keyboard:true,
touchZoom:true
}).setView([32.4279,53.6880],5);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);



const places=[
{
name:"تخت جمشید",
lat:29.935,
lng:52.891,
type:"تاریخی"
},
{
name:"دریاچه ارومیه",
lat:37.7,
lng:45.3,
type:"طبیعی"
},
{
name:"برج آزادی تهران",
lat:35.6997,
lng:51.338,
type:"شهری"
}
];


places.forEach(p=>{
L.marker([p.lat,p.lng])
.addTo(map)
.bindPopup(
"<b>"+p.name+"</b><br>"+p.type
);
});


const searchInput=document.getElementById("mapSearch");

if(searchInput){
searchInput.addEventListener("change",function(){

let text=this.value.trim();

let found=places.find(p=>
p.name.includes(text)
);

if(found){

map.setView(
[found.lat,found.lng],
10
);

}

});
}


window.addEventListener("load",()=>{
setTimeout(()=>{
map.invalidateSize();
},500);
});


/* ابزار قطب نما */
const compassBox=document.querySelector(".compassBox");
const compassNeedle=document.querySelector(".compassNeedle");

if(window.DeviceOrientationEvent){

window.addEventListener(
"deviceorientation",
function(e){

if(e.alpha!==null && compassNeedle){

compassNeedle.style.transform=
"rotate("+e.alpha+"deg)";

}

}
);

}


/* جلوگیری از خطای نقشه در تغییر اندازه */
window.addEventListener(
"resize",
()=>{
map.invalidateSize();
}
);

</script>

</body>
</html>
