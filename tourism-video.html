<style>
:root{
  --bg:#070f18;
  --card:#0d2432;
  --cardAlt:#0a1c28;
  --gold:#ffd36a;
  --goldBright:#ffe39a;
  --teal:#22e0ad;
  --tealBright:#6df5cf;
  --brand1:#11998e;
  --brand2:#38ef7d;
  --brand3:#667eea;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:#fff;
  font-family:Tahoma,Arial,sans-serif;padding-bottom:40px;
}
a{color:inherit;text-decoration:none;}

.videoWrap{width:100%;aspect-ratio:16/9;background:#000;}
.videoWrap iframe{width:100%;height:100%;border:0;display:block;}

.topBar{
  display:flex;align-items:center;gap:10px;padding:16px 16px 4px;
}
.backBtn{
  width:36px;height:36px;border-radius:50%;
  background:var(--card);border:1px solid rgba(255,211,106,.28);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.dTitle{font-size:19px;font-weight:900;line-height:1.6;flex:1;}

.tagRow{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:10px 16px 0;
}
.tag{
  padding:7px 13px;border-radius:20px;font-size:12px;font-weight:bold;
  background:var(--card);border:1px solid rgba(255,211,106,.25);color:var(--goldBright);
  display:flex;align-items:center;gap:5px;
}
.badgeNum{
  padding:6px 13px;border-radius:20px;font-size:12px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));
}

.body{padding:16px;}

.weatherBox{
  border-radius:16px;border:1px solid rgba(255,211,106,.25);
  background:linear-gradient(135deg,#103b50,#0d2432);overflow:hidden;margin-bottom:14px;
}
.weatherHead{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;}
.weatherHead .wTitle{flex:1;font-size:13.5px;font-weight:bold;}
.weatherBody{display:none;padding:0 16px 14px;font-size:12px;color:rgba(255,255,255,.75);}
.weatherBody.show{display:block;}

.sectionTitle{
  font-size:15px;font-weight:900;margin:22px 0 12px;display:flex;align-items:center;gap:8px;
}
.countPill{
  background:var(--card);border:1px solid rgba(255,211,106,.25);color:var(--goldBright);
  padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:bold;
}

.relatedRow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.relatedRow::-webkit-scrollbar{display:none;}
.relCard{
  flex-shrink:0;width:150px;border-radius:16px;overflow:hidden;
  background:var(--card);border:1px solid rgba(255,211,106,.14);
}
.relCoverWrap{position:relative;width:100%;aspect-ratio:1/1;background:#0a1c28;}
.relCoverWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;}
.relCoverWrap .playIc{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.relCoverWrap .playIc span{
  width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.42);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.relTitle{
  font-size:11.5px;font-weight:bold;line-height:1.6;padding:9px 10px 11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.excerptText{
  font-size:13.5px;line-height:1.9;color:rgba(255,255,255,.72);margin-top:8px;
}

.btnPrimary{
  width:100%;border:0;border-radius:16px;padding:15px;margin-top:20px;
  background:linear-gradient(135deg,var(--teal),var(--tealBright));
  color:#03202a;font-weight:900;font-size:14px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.btnGold{
  width:100%;border:0;border-radius:16px;padding:15px;margin-top:12px;
  background:linear-gradient(135deg,var(--gold),var(--goldBright));
  color:#3a2900;font-weight:900;font-size:14px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.btnOutline{
  width:100%;border:1px solid rgba(255,211,106,.35);border-radius:16px;padding:14px 16px;margin-top:12px;
  background:transparent;color:#fff;font-size:13.5px;font-family:inherit;
  display:flex;align-items:center;gap:10px;cursor:pointer;text-align:right;
}
.btnOutline .chev{margin-right:auto;opacity:.4;}

.linkGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.linkCard{
  background:var(--card);border:1px solid rgba(255,211,106,.2);border-radius:16px;
  padding:16px 10px;text-align:center;font-size:13px;font-weight:bold;
}
.linkIcon{
  width:44px;height:44px;border-radius:50%;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.linkIcon.web{background:linear-gradient(135deg,var(--brand1),var(--brand2));}
.linkIcon.ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);}

/* ---- CONTACT SHEET (reserve = 3 phone numbers) ---- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--card);border-radius:24px 24px 0 0;
  padding:16px 18px 26px;display:none;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
.sheet.show{display:block;}
.sheetHandle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:0 auto 14px;}
.sheetTitle{color:var(--goldBright);font-weight:bold;font-size:15px;margin-bottom:14px;}
.contactOpt{
  display:flex;align-items:center;gap:12px;background:#103b50;border:1px solid rgba(255,211,106,.25);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:#fff;
}
.contactIcon{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.contactLabel{font-size:12px;color:rgba(255,255,255,.55);}
.contactPhone{font-size:14px;font-weight:bold;}
.sheetOverlayBg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65;display:none;
}
.sheetOverlayBg.show{display:block;}
.seeAllLink{
  display:block;text-align:center;margin-top:8px;padding:12px;
  color:var(--goldBright);font-size:13px;font-weight:bold;
}
</style>

<div class="sheet" id="contactSheet">
  <div class="sheetHandle"></div>
  <div class="sheetTitle">📞 رزرو — یک شماره را انتخاب کنید</div>
  <div id="contactOptions"></div>

<script src="tourism-videos-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id"), 10) || TOURISM_VIDEOS[0].id;
const video = TOURISM_VIDEOS.find(function(v){ return v.id === id; }) || TOURISM_VIDEOS[0];
const cat = TOURISM_CATEGORIES[video.category];

document.title = video.title.fa + " | سایروس توریست";
(function(){
  var desc = "فیلم گردشگری « " + video.title.fa + " » در " + video.loc.fa + " — دسته‌بندی " + cat.fa + ". از سایروس توریست.";
  var pageUrl = "https://cyrustourist.ir/tourism-video.html?id=" + video.id;
  function setMeta(sel, attr, val){
    var el = document.querySelector(sel);
    if(el) el.setAttribute(attr, val);
  }
  setMeta('meta[name="description"]','content', desc);
  setMeta('meta[property="og:title"]','content', video.title.fa + " | سایروس توریست");
  setMeta('meta[property="og:description"]','content', desc);
  setMeta('meta[property="og:url"]','content', pageUrl);
  setMeta('meta[name="twitter:title"]','content', video.title.fa + " | سایروس توریست");
  setMeta('meta[name="twitter:description"]','content', desc);
  var canon = document.querySelector('link[rel="canonical"]');
  if(canon) canon.setAttribute('href', pageUrl);
})();
document.getElementById("mainIframe").src =
  "https://www.aparat.com/video/video/embed/videohash/" + video.hash + "/vt/frame";
document.getElementById("dTitle").textContent = video.title.fa;
document.getElementById("dCatTag").textContent = cat.icon + " " + cat.fa;
document.getElementById("dLocText").textContent = video.loc.fa;
document.getElementById("dBadge").textContent = "#" + video.id;

document.getElementById("excerptText").textContent =
  "بخشی از مجموعه فیلم‌های گردشگری سایروس توریست، در دسته‌ی " + cat.fa + "، در " + video.loc.fa + ".";

document.getElementById("amenitiesToggle").onclick = function(){
  location.href = "residences/residences.html";
};

/* ---------- ROUTE (uses my current location as origin when available) ---------- */

const destQuery = encodeURIComponent(video.loc.fa);
document.getElementById("routeBtn").href =
  "https://www.google.com/maps/search/?api=1&query=" + destQuery;

document.getElementById("routeBtn").onclick = function(e){
  if(!navigator.geolocation) return; // fallback: normal href works
  e.preventDefault();
  const btn = this;
  navigator.geolocation.getCurrentPosition(function(pos){
    const origin = pos.coords.latitude + "," + pos.coords.longitude;
    window.open(
      "https://www.google.com/maps/dir/?api=1&origin=" + origin + "&destination=" + destQuery,
      "_blank", "noopener"
    );
  }, function(){
    window.open(btn.href, "_blank", "noopener");
  }, { timeout: 6000 });
};

/* ---------- RESERVE (3 phone numbers sheet) ---------- */

const RESERVE_CONTACTS = [
  { key:"mobile",  icon:"📱", label:"تلفن همراه",   phone:"09153448818" },
  { key:"landline",icon:"☎️", label:"تلفن ثابت",    phone:"09153448818" },
  { key:"support", icon:"🎧", label:"تلفن پشتیبان", phone:"09153448818" }
];

const contactSheet = document.getElementById("contactSheet");
const contactBg = document.getElementById("contactBg");

document.getElementById("reserveBtn").onclick = function(){
  const opts = document.getElementById("contactOptions");
  opts.innerHTML = "";
  RESERVE_CONTACTS.forEach(function(r){
    if(!r.phone) return;
    const a = document.createElement("a");
    a.className = "contactOpt";
    a.href = "tel:" + r.phone;
    a.innerHTML =
      '<div class="contactIcon">'+r.icon+'</div>' +
      '<div><div class="contactLabel">'+r.label+'</div><div class="contactPhone">'+r.phone+'</div></div>';
    opts.appendChild(a);
  });
  contactSheet.classList.add("show");
  contactBg.classList.add("show");
};
contactBg.onclick = function(){
  contactSheet.classList.remove("show");
  contactBg.classList.remove("show");
};

/* ---------- RELATED VIDEOS (دست‌نخورده) ---------- */

const relRow = document.getElementById("relatedRow");
const others = TOURISM_VIDEOS.filter(function(v){ return v.id !== video.id; });
document.getElementById("relCount").textContent = TOURISM_VIDEOS.length + " فیلم";

others.slice(0, 8).forEach(function(v){
  const a = document.createElement("a");
  a.className = "relCard";
  a.href = "tourism-video.html?id=" + v.id;
  a.innerHTML =
    '<div class="relCoverWrap">' +
      '<iframe src="https://www.aparat.com/video/video/embed/videohash/' + v.hash + '/vt/frame" loading="lazy"></iframe>' +
      '<div class="playIc"><span>▶</span></div>' +
    '</div>' +
    '<div class="relTitle">' + v.title.fa + '</div>';
  relRow.appendChild(a);
});

/* ---------- WEATHER (دست‌نخورده) ---------- */

let weatherLoaded = false;

document.getElementById("weatherToggle").onclick = function(){
  const body = document.getElementById("weatherBody");
  const willShow = !body.classList.contains("show");
  body.classList.toggle("show");
  document.getElementById("weatherChev").textContent = willShow ? "▴" : "▾";
  if(willShow && !weatherLoaded){
    loadWeather();
  }
};

function loadWeather(){
  const body = document.getElementById("weatherBody");
  const summary = document.getElementById("weatherSummary");
  body.innerHTML = "در حال دریافت موقعیت شما…";

  if(!navigator.geolocation){
    body.innerHTML = "مرورگر شما موقعیت‌مکانی را پشتیبانی نمی‌کند.";
    return;
  }

  navigator.geolocation.getCurrentPosition(async function(pos){
    try{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const wUrl = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
        "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto";
      const wRes = await fetch(wUrl);
      const wData = await wRes.json();
      const cur = wData.current;

      if(!cur){
        body.innerHTML = "دریافت آب‌وهوا ممکن نشد.";
        return;
      }

      const emoji = weatherEmoji(cur.weather_code);
      const label = weatherLabel(cur.weather_code);
      const temp = Math.round(cur.temperature_2m);

      summary.textContent = emoji + " " + temp + "°";
      body.innerHTML =
        '<div>'+label+'</div>' +
        '<div style="margin-top:6px;">💧 '+cur.relative_humidity_2m+'٪ &nbsp; 🌬️ '+Math.round(cur.wind_speed_10m)+' km/h</div>';

      weatherLoaded = true;
    }catch(e){
      body.innerHTML = "دریافت آب‌وهوا ممکن نشد.";
    }
  }, function(){
    body.innerHTML = "دسترسی به موقعیت‌مکانی رد شد.";
  });
}

function weatherEmoji(code){
  if(code===0) return "☀️";
  if(code===1||code===2) return "🌤️";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code>=51&&code<=57) return "🌦️";
  if(code>=61&&code<=67) return "🌧️";
  if(code>=71&&code<=77) return "🌨️";
  if(code>=80&&code<=82) return "🌧️";
  if(code===85||code===86) return "🌨️";
  if(code>=95) return "⛈️";
  return "🌡️";
}
function weatherLabel(code){
  if(code===0) return "صاف";
  if(code===1) return "کمی ابری";
  if(code===2) return "نیمه‌ابری";
  if(code===3) return "ابری";
  if(code===45||code===48) return "مه‌آلود";
  if(code>=51&&code<=57) return "نم‌نم باران";
  if(code>=61&&code<=67) return "بارانی";
  if(code>=71&&code<=77) return "برفی";
  if(code>=80&&code<=82) return "رگبار";
  if(code===85||code===86) return "رگبار برف";
  if(code>=95) return "رعدوبرق";
  return "نامشخص";
}
</script>
